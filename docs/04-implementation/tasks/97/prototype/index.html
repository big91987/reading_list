<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe6" />
    <title>页间 · 读书清单</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="demo-tools" aria-label="原型演示工具">
      <strong>Issue #97 设计原型 · 非产品界面</strong>
      <button type="button" id="demo-mixed">预置已读与未读</button>
      <button type="button" id="demo-clear">清空演示清单</button>
      <button type="button" id="demo-zoom">200% CSS 缩放模拟</button>
      <button type="button" id="demo-reset">恢复100%</button>
      <p id="demo-report" role="status"></p>
      <a href="product-validation/index.html">研发产品快照诊断（非设计界面）</a>
    </aside>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">READING NOTES · 读有所记</p>
        <div class="title-row">
          <div>
            <h1>页间</h1>
            <p class="subtitle">把想读的书收进来，也把读完的时光留下。</p>
          </div>
          <div class="book-mark" aria-hidden="true"><span>阅</span></div>
        </div>
      </header>

      <section class="add-panel" aria-labelledby="add-heading">
        <div>
          <p class="section-kicker">添加一本书</p>
          <h2 id="add-heading">下一本，想读什么？</h2>
        </div>
        <form id="book-form" novalidate>
          <label for="book-title">书名</label>
          <div class="input-row">
            <input
              id="book-title"
              name="title"
              type="text"
              maxlength="80"
              autocomplete="off"
              placeholder="例如：长安的荔枝"
              required
            />
            <button class="primary-button" type="submit">新增书籍</button>
          </div>
          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <section class="list-panel" aria-labelledby="list-heading">
        <div class="list-header">
          <div>
            <p class="section-kicker">我的书架</p>
            <h2 id="list-heading">阅读清单</h2>
          </div>
          <p
            id="reading-summary"
            class="reading-summary"
            aria-live="polite"
          ></p>
        </div>

        <div class="filters" role="group" aria-label="筛选书籍">
          <button
            type="button"
            class="filter-button is-active"
            data-filter="all"
            aria-pressed="true"
          >
            全部
            <span class="filter-tooltip" aria-hidden="true">显示所有书籍</span>
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="unread"
            aria-pressed="false"
          >
            未读
            <span class="filter-tooltip" aria-hidden="true"
              >只显示未读书籍</span
            >
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="read"
            aria-pressed="false"
          >
            已读
            <span class="filter-tooltip" aria-hidden="true"
              >只显示已读书籍</span
            >
          </button>
        </div>

        <div id="undo-panel" class="undo-panel" hidden>
          <div class="undo-copy">
            <p id="undo-message" role="status" aria-live="polite"></p>
            <p class="undo-help">仅可撤销最近一次删除 · 刷新后失效</p>
            <p id="undo-error" class="edit-error" role="alert"></p>
          </div>
          <button id="undo-button" type="button" class="text-button">
            撤销删除
          </button>
        </div>
        <ul id="book-list" class="book-list" aria-label="书籍清单"></ul>
        <p
          id="operation-message"
          class="form-message"
          role="status"
          aria-live="polite"
        ></p>
        <div id="empty-state" class="empty-state" hidden>
          <span aria-hidden="true">◌</span>
          <h3 id="empty-title">清单还是空的</h3>
          <p id="empty-description">从一本真正想读的书开始吧。</p>
        </div>
      </section>
    </main>

    <footer>
      <p class="footer-motto">一本一本，慢慢读完。</p>
      <p class="app-version">版本 <span id="app-version">0.1.0 rc2</span></p>
    </footer>
    <script src="app.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
