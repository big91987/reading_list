<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe6" />
    <title>页间 · 读书清单</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">READING NOTES · 读有所记</p>
        <div class="title-row">
          <div>
            <h1>页间</h1>
            <p class="subtitle">把想读的书收进来，也把读完的时光留下。</p>
          </div>
          <div class="book-mark" aria-hidden="true"><span>阅</span></div>
        </div>
      </header>

      <nav class="view-tabs" aria-label="书架视图">
        <button id="list-tab" type="button" aria-pressed="true">
          我的书单
        </button>
        <button id="recommend-tab" type="button" aria-pressed="false">
          书籍推荐
        </button>
      </nav>
      <section
        id="recommend-panel"
        class="list-panel"
        hidden
        aria-labelledby="recommend-heading"
      >
        <h2 id="recommend-heading">官方来源 · 书籍推荐</h2>
        <p>
          简介为本产品原创事实短概述，类型为本产品映射；不代表来源官方分类。
        </p>
        <label for="recommend-type">推荐类型</label>
        <select id="recommend-type">
          <option value="">全部类型</option>
        </select>
        <button id="recommend-retry" type="button">重试读取目录</button>
        <p id="recommend-status" role="status" aria-live="polite">
          正在加载推荐目录。
        </p>
        <p id="recommend-message" role="status" aria-live="polite"></p>
        <div id="recommend-records"></div>
      </section>

      <section class="add-panel" aria-labelledby="add-heading">
        <div>
          <p class="section-kicker">添加一本书</p>
          <h2 id="add-heading">下一本，想读什么？</h2>
        </div>
        <form id="book-form" novalidate>
          <label for="book-title">书名</label>
          <div class="input-row">
            <input
              id="book-title"
              name="title"
              type="text"
              maxlength="80"
              autocomplete="off"
              placeholder="例如：长安的荔枝"
              required
            />
            <button class="primary-button" type="submit">新增书籍</button>
          </div>
          <fieldset id="new-types"><legend>类型（最多3个）</legend></fieldset>
          <label for="new-summary">简介</label>
          <textarea
            id="new-summary"
            rows="3"
            placeholder="可选，最多600字"
          ></textarea>
          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <section class="list-panel" aria-labelledby="list-heading">
        <div class="list-header">
          <div>
            <p class="section-kicker">我的书架</p>
            <h2 id="list-heading">阅读清单</h2>
          </div>
          <p
            id="reading-summary"
            class="reading-summary"
            aria-live="polite"
          ></p>
        </div>

        <div class="filters" role="group" aria-label="筛选书籍">
          <button
            type="button"
            class="filter-button is-active"
            data-filter="all"
            aria-pressed="true"
          >
            全部
            <span class="filter-tooltip" aria-hidden="true">显示所有书籍</span>
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="unread"
            aria-pressed="false"
          >
            未读
            <span class="filter-tooltip" aria-hidden="true"
              >只显示未读书籍</span
            >
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="read"
            aria-pressed="false"
          >
            已读
            <span class="filter-tooltip" aria-hidden="true"
              >只显示已读书籍</span
            >
          </button>
        </div>

        <div id="undo-panel" class="undo-panel" hidden>
          <div class="undo-copy">
            <p id="undo-message" role="status" aria-live="polite"></p>
            <p class="undo-help">仅可撤销最近一次删除 · 刷新后失效</p>
            <p id="undo-error" class="edit-error" role="alert"></p>
          </div>
          <button id="undo-button" type="button" class="text-button">
            撤销删除
          </button>
        </div>
        <ul id="book-list" class="book-list" aria-label="书籍清单"></ul>
        <p
          id="operation-message"
          class="form-message"
          role="status"
          aria-live="polite"
        ></p>
        <div id="empty-state" class="empty-state" hidden>
          <span aria-hidden="true">◌</span>
          <h3 id="empty-title">清单还是空的</h3>
          <p id="empty-description">从一本真正想读的书开始吧。</p>
        </div>
      </section>
    </main>

    <footer>
      <p class="footer-motto">一本一本，慢慢读完。</p>
      <p class="app-version">版本 <span id="app-version">0.1.0 rc2</span></p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
