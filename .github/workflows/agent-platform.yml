name: Agent Platform pipeline
on:
  issues:
    types: [opened]
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      issue:
        description: Product Issue number
        type: string
        required: true
      after:
        description: Completed upstream stage (verify starts QA again after confirmed fixes)
        type: choice
        options: [start, requirements, design, development, qa, verify, code_review]
        default: start
      target_stage:
        description: Handoff destination (next or earlier stage; required for QA)
        type: choice
        options: ['', requirements, design, development, qa, report]
        default: ''
      result_file:
        description: Runner-local handoff receipt (matched against registration)
        type: string
        default: ''
      result_sha256:
        description: Handoff digest supplied by the registered MCP tool
        type: string
        default: ''
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: agent-platform-${{ github.repository }}-${{ github.event.issue.number || inputs.issue || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  requirements:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && ((github.event_name == 'issues' || inputs.after == 'start') || (github.event_name == 'workflow_dispatch' && (inputs.after == 'design' || inputs.after == 'development' || inputs.after == 'qa') && inputs.target_stage == 'requirements'))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: requirements · persistent Agent conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          AFTER_STAGE: ${{ inputs.after }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage requirements
  design:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && ((inputs.after == 'requirements' && (inputs.target_stage == '' || inputs.target_stage == 'design')) || (github.event_name == 'workflow_dispatch' && (inputs.after == 'development' || inputs.after == 'qa') && inputs.target_stage == 'design'))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: design · persistent Agent conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          AFTER_STAGE: ${{ inputs.after }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage design
  development:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && ((inputs.after == 'design' && (inputs.target_stage == '' || inputs.target_stage == 'development')) || (github.event_name == 'workflow_dispatch' && (inputs.after == 'qa') && inputs.target_stage == 'development'))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: development · persistent Agent conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          AFTER_STAGE: ${{ inputs.after }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage development
  qa:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (((inputs.after == 'development' && (inputs.target_stage == '' || inputs.target_stage == 'qa')) || inputs.after == 'verify'))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: qa · persistent Agent conversation
        env:
          REVERIFY_RUN: ${{ inputs.after == 'verify' && github.run_id || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          AFTER_STAGE: ${{ inputs.after }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage qa
  review:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && ((github.event_name == 'workflow_dispatch' && inputs.after == 'code_review') || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: review · persistent Agent conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          AFTER_STAGE: code_review
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage review
  report:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'workflow_dispatch' && inputs.after == 'qa' && (inputs.target_stage == '' || inputs.target_stage == 'report'))
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 25
    steps:
      - name: report · persistent Agent conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          AFTER_STAGE: ${{ inputs.after }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          RESULT_FILE: ${{ inputs.result_file }}
          AGENT_PLATFORM_ROOT: ${{ vars.AGENT_PLATFORM_ROOT }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$AGENT_PLATFORM_ROOT"
          "$AGENT_PLATFORM_ROOT/.data/runner-venv/bin/python" \
            "$AGENT_PLATFORM_ROOT/examples/github/pipeline.py" \
            --config "$AGENT_PLATFORM_ROOT/.data/github-runner.json" --stage report
